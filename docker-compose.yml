# Development-only infrastructure for the Real-Time Ride Matching System.
# Credentials here are for LOCAL DEVELOPMENT ONLY and must never be used in production.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ridematch-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      # Local-development password only. Override via a MSSQL_SA_PASSWORD environment
      # variable (or a .env file / secret store) for anything beyond local dev.
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Your_password123}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -No -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7
    container_name: ridematch-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sqlserver-data:
  redis-data:
